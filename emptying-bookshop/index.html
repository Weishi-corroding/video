<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Emptying Bookshop · Applying Marxist Principles to Dialectical Thinking</title>
  <meta name="description" content="A seven-minute Three.js animated story about using Marxist principles to think dialectically.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three-r186/build/three.module.js",
        "three/addons/": "./vendor/three-r186/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="player" class="player">
    <div id="stage" class="stage"></div>
    <div id="labels" class="labels"></div>

    <div id="captions" class="captions" aria-live="polite">
      <div class="cap"><div class="cap-en"></div><div class="cap-zh" lang="zh-Hans"></div></div>
    </div>

    <div id="chrome" class="chrome">
      <div id="seek" class="seek" role="slider" aria-label="Seek" tabindex="0">
        <div id="segs" class="segs"></div>
        <div id="knob" class="knob"></div>
        <div id="tip" class="tip"></div>
      </div>
      <div class="bar">
        <button id="playBtn" class="btn icon" aria-label="Play (Space)" title="Play / pause (Space)">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M7 4.5v15l13-7.5z"/></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>
        </button>
        <span id="time" class="time">0:00 / 0:00</span>
        <span id="chname" class="chname"></span>
        <span class="spacer"></span>
        <div class="menu-wrap">
          <button id="chapBtn" class="btn txt" aria-haspopup="true" title="Chapters (↑/↓, 1–7)">Chapters</button>
          <div id="chapMenu" class="menu" role="menu"></div>
        </div>
        <div class="menu-wrap">
          <button id="speedBtn" class="btn txt" aria-haspopup="true" title="Speed (, and .)">1×</button>
          <div id="speedMenu" class="menu narrow" role="menu"></div>
        </div>
        <button id="ccBtn" class="btn txt toggle" aria-pressed="true" title="English captions (C)">CC</button>
        <button id="zhBtn" class="btn txt toggle" aria-pressed="false" title="Chinese subtitles (Z)" lang="zh-Hans">中文</button>
        <div class="menu-wrap split">
          <button id="voiceBtn" class="btn txt toggle" aria-pressed="false" title="Narration (N)">Voice</button>
          <button id="voiceCaret" class="btn caret" aria-haspopup="true" aria-label="Choose voice" title="Choose voice">▾</button>
          <div id="voiceMenu" class="menu wide" role="menu"></div>
        </div>
        <button id="fsBtn" class="btn icon" aria-label="Fullscreen (F)" title="Fullscreen (F)">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm10-5h6v5h-2V6h-4zM4 15h2v3h3v2H4zm14 3v-3h2v5h-6v-2z"/></svg>
        </button>
      </div>
    </div>

    <div id="start" class="start">
      <div class="start-card">
        <div class="eyebrow">A seven-minute animated story · 七分钟动画故事</div>
        <h1>The Emptying Bookshop</h1>
        <div class="h1zh" lang="zh-Hans">日渐冷清的书店</div>
        <p class="sub">How to apply Marxist principles to improve dialectical thinking skills</p>
        <p class="subzh" lang="zh-Hans">运用马克思主义基本原理，提升辩证思维能力</p>
        <div class="actions">
          <button id="startVoice" class="primary">▶&nbsp; Play with narration</button>
          <button id="startMuted" class="secondary">Play without narration</button>
        </div>
        <label class="chk"><input type="checkbox" id="startZh"> <span>Chinese subtitles · <span lang="zh-Hans">中文字幕</span></span></label>
        <p id="voiceNote" class="note"></p>
        <p class="keys">Space play/pause · ←/→ seek · ↑/↓ chapters · C captions · Z 中文 · N narration · F fullscreen</p>
      </div>
    </div>

    <div id="loading" class="loading">Loading…</div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
